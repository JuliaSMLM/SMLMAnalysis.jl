SMLMData = "5488f106-40b8-4660-84c5-84a168990d1b"
SMLMDeepFit = "cd1e22bb-7bb2-459d-a82d-93d34b459d6b"
SMLMSim = "5a0a87e4-02d4-41f5-bf26-b8c94c784a04"
